<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - POL Akıllı Fiş Yönetimi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 350px; background-color: #2c3e50; color: white;">
        <h3 class="text-center mb-4 fw-bold">🧾 POL Akıllı Fiş</h3>
        {% if hata %}
            <div class="alert alert-danger py-2 small">{{ hata }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Kullanıcı Adı</label>
                <input type="text" name="kullanici" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Şifre</label>
                <input type="password" name="sifre" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
