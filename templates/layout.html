<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Akıllı Fiş Yönetimi{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <!-- SABİT ÜST BAŞLIK -->
    <header class="bg-dark text-white py-3 shadow-sm" style="background-color: #2c3e50 !important;">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0"><strong>🧾 POL Akıllı Fiş Yönetimi</strong></h1>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-secondary font-monospace">Kullanıcı: POLadmin</span>
                <a href="/cikis" class="btn btn-outline-light btn-sm">🚪 Çıkış</a>
            </div>
        </div>
    </header>

    <!-- ÜST YATAY MENÜ (İstediğiniz Sırada ve Renkte) -->
    <nav class="border-bottom shadow-sm mb-4" style="background-color: #2c3e50;">
        <div class="container py-2 d-flex gap-2 flex-wrap">
            <a href="/tara" class="btn btn-success btn-sm fw-bold">🔍 Fiş Yükle</a>
            <a href="/" class="btn btn-primary btn-sm fw-bold">📋 Fiş Listesi</a>
            <a href="/raporlar" class="btn btn-primary btn-sm fw-bold">📊 Harcama Rapor ve Analizi</a>
        </div>
    </nav>

    <!-- DİNAMİK İÇERİK ALANI -->
    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
